name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend build + tests (SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd_Strong!"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd_Strong!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Restore
        run: dotnet restore backend/BookFlow.sln
      - name: Build
        run: dotnet build backend/BookFlow.sln -c Release --no-restore -warnaserror:CS8600,CS8602,CS8603
      - name: Unit tests
        run: dotnet test backend/tests/BookFlow.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Integration tests
        env:
          BOOKFLOW_TEST_CONNECTION: "Server=localhost,1433;Database=BookFlowTests;User Id=sa;Password=Ci_Passw0rd_Strong!;TrustServerCertificate=True;Encrypt=True"
        run: dotnet test backend/tests/BookFlow.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - name: Vulnerable packages
        run: dotnet list backend/BookFlow.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt; ! grep -q "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: "backend/tests/**/TestResults/*.trx" }

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --audit-level=high || true
        working-directory: frontend
      - run: npx ng build --configuration production
        working-directory: frontend

  images:
    name: Build & push images
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/src/BookFlow.API/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
