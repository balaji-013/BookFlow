# Serves the Angular SPA and proxies /api to the API container.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (TLS is terminated by the edge proxy / Caddy in docker-compose.prod.yml)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    location /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;      # Excel import may take up to 120 s
        client_max_body_size 12m;
    }
    location /health { proxy_pass http://api:8080/health; }
    location /swagger/ { proxy_pass http://api:8080/swagger/; proxy_set_header Host $host; }

    # Hashed assets: cache for a year. index.html: never cache.
    location ~* \.(js|css|woff2?|png|svg|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
