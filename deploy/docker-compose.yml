# BookFlow — local development / pilot stack.
#   cp deploy/.env.example deploy/.env   (edit secrets)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Web: http://localhost:8080   API docs: http://localhost:8080/swagger (when Swagger__Enabled=true)
name: bookflow

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Express}
      TZ: Asia/Kolkata
    volumes:
      - mssql_data:/var/opt/mssql
      - bookflow_backups:/var/opt/mssql/backup
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    # Not published to the host in prod; uncomment for local DB tools.
    # ports: ["1433:1433"]

  migrate:
    build: { context: ../backend, dockerfile: src/BookFlow.API/Dockerfile }
    image: bookflow-api:latest
    command: ["dotnet", "BookFlow.API.dll", "--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=BookFlow;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
    depends_on:
      sqlserver: { condition: service_healthy }
    restart: "no"

  api:
    image: bookflow-api:latest
    build: { context: ../backend, dockerfile: src/BookFlow.API/Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=BookFlow;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: BookFlow
      Jwt__Audience: BookFlow.Client
      Cors__AllowedOrigins__0: ${PUBLIC_URL:-http://localhost:8080}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Database__MigrateOnStartup: "false"
      TZ: Asia/Kolkata
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources: { limits: { memory: 768M } }

  web:
    build: { context: ../frontend }
    image: bookflow-web:latest
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mssql_data:
  bookflow_backups:
