# Production overlay: adds Caddy for automatic HTTPS and a backup sidecar.
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
services:
  web:
    ports: []            # only Caddy is exposed
    expose: ["80"]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. app.bookflow.in)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped

  backup:
    image: mcr.microsoft.com/mssql/server:2022-latest   # reused only for its sqlcmd binary
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]
    user: root
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts:/scripts:ro
      - bookflow_backups:/var/opt/mssql/backup
    depends_on:
      sqlserver: { condition: service_healthy }
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
